<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري للمنتجات المفضلة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; text-align: center; }
        header { background-color: #1abc9c; color: white; padding: 20px; font-size: 24px; font-weight: bold; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; gap: 20px; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 280px; padding: 15px; text-align: center; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { max-width: 100%; border-radius: 8px; height: 200px; object-fit: cover; }
        .card h3 { font-size: 18px; color: #333; margin: 10px 0; }
        .card .price { color: #e74c3c; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .btn { display: inline-block; background-color: #1abc9c; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn:hover { background-color: #16a085; }
    </style>
</head>
<body>

    <header>🛍️ مختاراتي لأفضل المنتجات الذكية</header>

    <div class="container">
        <!-- المنتج الأول -->
        <div class="card">
            <img src="https://unsplash.com" alt="سماعة لاسلكية">
            <h3>سماعة رأس عازلة للضوضاء</h3>
            <div class="price">199 ريال</div>
            <!-- ضع رابط الأفلييت الخاص بك مكان علامة # -->
            <a href="#" target="_blank" class="btn">اطلبها الآن</a>
        </div>

        <!-- المنتج الثاني -->
        <div class="card">
            <img src="https://unsplash.com" alt="ساعة ذكية">
            <h3>ساعة ذكية رياضية مقاومة للماء</h3>
            <div class="price">250 ريال</div>
            <!-- ضع رابط الأفلييت الخاص بك مكان علامة # -->
            <a href="#" target="_blank" class="btn">اطلبها الآن</a>
        </div>
    </div>

</body>
</html>
